[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "../agents" }]

[rpc_endpoints]
# Dwellir full nodes; DWELLIR_API_KEY comes from the environment (resolved only when an alias is used).
monad_testnet = "https://api-monad-testnet-full.n.dwellir.com/${DWELLIR_API_KEY}"
monad = "https://api-monad-mainnet-full.n.dwellir.com/${DWELLIR_API_KEY}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
