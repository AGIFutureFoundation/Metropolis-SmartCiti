name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        working-directory: contracts
        run: forge test -vv
      - name: no secrets committed
        run: |
          ! git ls-files | grep -E '(^|/)\.env$'
          # Match real values only (PKCS8 PEM base64 always starts "LS0t"), not the template in wallets.mjs
          ! git grep -nE 'PRIVATE_KEY=0x[0-9a-fA-F]{64}|P256_PKCS8=LS0t|AGENT_MNEMONIC="[a-z]+( [a-z]+){11}|DWELLIR_API_KEY=[A-Za-z0-9-]{16,}|n\.dwellir\.com/[A-Za-z0-9-]{16,}' -- ':!*.md' ':!.github/**'
  agents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: syntax check
        run: for f in agents/*.mjs; do node --check "$f"; done
